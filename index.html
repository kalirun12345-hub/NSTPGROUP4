<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActFast sa Tipas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #f7f8fa;
            --text-main: #2f3542;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center;
        }

        .app-card { 
            width: 100%; max-width: 450px; 
            background: white; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .header { padding: 20px; background: white; border-bottom: 1px solid #eee; text-align: center; }
        .header h2 { margin: 0; color: var(--primary-color); }
        .content { padding: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: #57606f; }
        
        input, select, textarea { 
            width: 100%; padding: 12px; border: 2px solid #edeff2; border-radius: 12px; 
            font-size: 1rem; transition: 0.2s; outline: none; box-sizing: border-box;
        }

        .photo-upload-box {
            border: 2px dashed #ced6e0; border-radius: 12px;
            padding: 20px; text-align: center; cursor: pointer;
            margin-bottom: 15px; background: #fafafa;
        }

        #preview-img { width: 100%; border-radius: 12px; margin-top: 10px; display: none; }

        .btn-submit { 
            background: var(--primary-color); color: white; border: none; 
            width: 100%; padding: 15px; border-radius: 12px; 
            font-size: 1rem; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="header">
            <h2>📢 ActFast sa Tipas</h2>
            <p>Report an incident to the Barangay Command Center.</p>
        </div>

        <div class="content">
            <div class="input-group">
                <label>Incident Type</label>
                <select id="type">
                    <option value="Accident">🚑 Accident</option>
                    <option value="Fallen Tree">🌳 Fallen Tree / Debris</option>
                    <option value="Fire">🔥 Fire Alert</option>
                    <option value="Other">❓ Others</option>
                </select>
            </div>

            <div class="input-group">
                <label>Location</label>
                <input type="text" id="loc" placeholder="Street name or landmark...">
            </div>

            <div class="input-group">
                <label>Details</label>
                <textarea id="desc" rows="2" placeholder="Tell us more..."></textarea>
            </div>

            <div class="photo-upload-box" onclick="document.getElementById('file').click()">
                <strong id="upload-status">📸 Tap to Open Camera</strong>
                <img id="preview-img" src="">
            </div>
            
            <input type="file" id="file" accept="image/*" capture="environment" hidden onchange="showPreview()">

            <button class="btn-submit" id="submitBtn" onclick="submitReport()">Post to Barangay Feed</button>
        </div>
    </div>

<script type="module">
    // 1. Firebase Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref as dbRef, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // 2. Updated Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDeKvRKTnlAfRGMQWbf2OQ3hkPmhQ5Z5cQ",
        authDomain: "actfast-tipas.firebaseapp.com",
        projectId: "actfast-tipas",
        storageBucket: "actfast-tipas.firebasestorage.app",
        messagingSenderId: "848943253174",
        appId: "1:848943253174:web:444d5c8f63534803dec817",
        databaseURL: "https://actfast-tipas-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    // 3. Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);

    // 4. Show Image Preview
    window.showPreview = function() {
        const file = document.getElementById("file").files[0];
        const preview = document.getElementById("preview-img");
        const status = document.getElementById("upload-status");

        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
            status.innerText = "✅ Photo Attached";
        }
    }

    // 5. Submit Report to Firebase Storage + Realtime Database
    window.submitReport = async function() {
        const fileInput = document.getElementById("file");
        const file = fileInput.files[0];
        const locationVal = document.getElementById("loc").value;
        const submitBtn = document.getElementById("submitBtn");

        if (!file || !locationVal) {
            alert("Please take a photo and enter the location.");
            return;
        }

        // Disable button to prevent double clicks
        submitBtn.disabled = true;
        submitBtn.innerText = "Uploading...";

        try {
            // Step A: Upload Image to Firebase Storage
            const fileName = Date.now() + "_" + file.name;
            const storageRef = sRef(storage, 'reports/' + fileName);
            const snapshot = await uploadBytes(storageRef, file);
            
            // Step B: Get the URL
            const downloadURL = await getDownloadURL(snapshot.ref);

            // Step C: Save details to Realtime Database
            const newReportRef = push(dbRef(db, 'reports'));
            await set(newReportRef, {
                type: document.getElementById("type").value,
                location: locationVal,
                description: document.getElementById("desc").value,
                imageUrl: downloadURL,
                timestamp: new Date().toLocaleString()
            });

            alert("Success! Your report has been posted.");
            location.reload();

        } catch (error) {
            console.error(error);
            alert("Error: " + error.message);
            submitBtn.disabled = false;
            submitBtn.innerText = "Post to Barangay Feed";
        }
    }
</script>

</body>
</html>
