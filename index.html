<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActFast sa Tipas - Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #007bff; --bg-color: #f7f8fa; --text-main: #2f3542; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .app-card { width: 100%; max-width: 450px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; }
        .header { padding: 20px; background: white; border-bottom: 1px solid #eee; text-align: center; }
        .header h2 { margin: 0; color: var(--primary-color); }
        .content { padding: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: #57606f; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #edeff2; border-radius: 12px; font-size: 1rem; box-sizing: border-box; outline: none; }
        .photo-upload-box { border: 2px dashed #ced6e0; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; background: #fafafa; margin-bottom: 15px; }
        #preview-img { width: 100%; border-radius: 12px; margin-top: 10px; display: none; }
        .btn-submit { background: var(--primary-color); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="header">
            <h2>📢 ActFast sa Tipas</h2>
            <p>Help our community. Report an incident now.</p>
        </div>

        <div class="content">
            <div class="input-group">
                <label>What happened?</label>
                <select id="type">
                    <option value="Accident">🚑 Accident</option>
                    <option value="Fallen Tree">🌳 Fallen Tree / Debris</option>
                    <option value="Fire">🔥 Fire Alert</option>
                    <option value="Other">❓ Others</option>
                </select>
            </div>

            <div class="input-group">
                <label>Location</label>
                <input type="text" id="loc" placeholder="Street name or landmark...">
            </div>

            <div class="input-group">
                <label>Details</label>
                <textarea id="desc" rows="2" placeholder="Tell us more..."></textarea>
            </div>

            <div class="photo-upload-box" onclick="document.getElementById('file').click()">
                <strong id="upload-status">📸 Tap to Open Camera</strong>
                <img id="preview-img" src="">
            </div>
            
            <input type="file" id="file" accept="image/*" capture="environment" hidden onchange="showPreview()">
            <button class="btn-submit" onclick="submitReport()">Post to Barangay Feed</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDeKvRKTnlAfRGMQWbf2OQ3hkPmhQ5Z5cQ",
        authDomain: "actfast-tipas.firebaseapp.com",
        projectId: "actfast-tipas",
        storageBucket: "actfast-tipas.firebasestorage.app",
        messagingSenderId: "848943253174",
        appId: "1:848943253174:web:444d5c8f63534803dec817"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.showPreview = function() {
        const file = document.getElementById("file").files[0];
        const preview = document.getElementById("preview-img");
        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
            document.getElementById("upload-status").innerText = "✅ Photo Attached";
        }
    }

    window.submitReport = function() {
        const fileInput = document.getElementById("file");
        const type = document.getElementById("type").value;
        const locationVal = document.getElementById("loc").value;
        const desc = document.getElementById("desc").value;

        if (!fileInput.files[0] || !locationVal) {
            alert("Please take a photo and enter the location.");
            return;
        }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        formData.append("upload_preset", "YOUR_CLOUDINARY_PRESET"); // UPDATE THIS

        fetch("https://api.cloudinary.com/v1_1/YOUR_CLOUD_NAME/image/upload", { // UPDATE THIS
            method: "POST",
            body: formData
        })
        .then(res => res.json())
        .then(cloudinaryData => {
            const reportsRef = ref(db, 'reports');
            const newReportRef = push(reportsRef);
            set(newReportRef, {
                type,
                location: locationVal,
                description: desc,
                imageUrl: cloudinaryData.secure_url,
                timestamp: new Date().toLocaleString()
            }).then(() => {
                alert("Success! Reported.");
                location.reload();
            });
        });
    }
</script>
</body>
</html>
