<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ActFast sa Tipas - Report</title>

    <!-- Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Mapbox GL CSS (replace token below in script) -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet" />

    <style>
        :root { --primary-color: #007bff; --bg-color: #f7f8fa; --text-main: #2f3542; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .app-card { width: 100%; max-width: 450px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; }
        .header { padding: 20px; background: white; border-bottom: 1px solid #eee; text-align: center; }
        .header h2 { margin: 0; color: var(--primary-color); font-size: 1.5rem; }
        .content { padding: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: #57606f; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #edeff2; border-radius: 12px; font-size: 1rem; outline: none; box-sizing: border-box; }
        .photo-upload-box { border: 2px dashed #ced6e0; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; background: #fafafa; margin-bottom: 15px; }
        #preview-img { width: 100%; border-radius: 12px; margin-top: 10px; display: none; }
        .btn-submit { background: var(--primary-color); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .btn-submit:disabled { background: #a4b0be; }

        /* Map styles */
        #map { width: 100%; height: 220px; border-radius: 12px; overflow: hidden; margin-bottom: 12px; border: 2px solid #edeff2; }
        .map-actions { display:flex; gap:8px; margin-bottom:12px; }
        .map-actions button { flex:1; padding:10px; border-radius: 10px; border: 1px solid #dfe4ea; background: white; cursor: pointer; font-weight:600; }
        .coords { font-size: 0.85rem; color: #57606f; margin-bottom: 12px; }

        @media (max-width:480px){
            #map { height: 200px; }
        }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="header">
            <h2>📢 ActFast sa Tipas</h2>
            <p>Help the Barangay. Report an incident.</p>
        </div>

        <div class="content">
            <div class="input-group">
                <label>Incident Type</label>
                <select id="type">
                    <option value="Accident">🚑 Accident</option>
                    <option value="Fallen Tree">🌳 Fallen Tree / Debris</option>
                    <option value="Fire">🔥 Fire Alert</option>
                    <option value="Other">❓ Others</option>
                </select>
            </div>

            <div class="input-group">
                <label>Location (text)</label>
                <input type="text" id="loc" placeholder="Street name or landmark...">
            </div>

            <div class="input-group">
                <label>Pin location on map</label>
                <div id="map"></div>
                <div class="map-actions">
                    <button id="use-location-btn" type="button">Use my location</button>
                    <button id="clear-marker-btn" type="button">Clear</button>
                </div>
                <div class="coords" id="coords-display">No location selected</div>
            </div>

            <div class="input-group">
                <label>Details</label>
                <textarea id="desc" rows="2" placeholder="Briefly describe the situation..."></textarea>
            </div>

            <div class="photo-upload-box" onclick="document.getElementById('file').click()">
                <strong id="upload-status">📸 Tap to Open Camera</strong>
                <img id="preview-img" src="">
            </div>
            
            <input type="file" id="file" accept="image/*" capture="environment" hidden onchange="showPreview()">

            <!-- Hidden inputs for coords -->
            <input type="hidden" id="lat" />
            <input type="hidden" id="lng" />

            <button class="btn-submit" id="submitBtn" onclick="submitReport()">Post to Barangay Feed</button>
        </div>
    </div>

    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>

    <script>
        // Mapbox token provided by user
        const MAPBOX_TOKEN = "sk.eyJ1IjoiYW51Ymlzczc3OCIsImEiOiJjbWtybzZseHkwaHBrM2lzNDZ6cmtsZzUzIn0.QWX1eIpVJB5iyb_70kG1JQ";

        // Existing constants
        const IMGBB_KEY = "f9aa18bd6a2de697cac458627361d7f6";
        const SHEETS_URL = "https://script.google.com/macros/s/AKfycbwzwW9qSrDqxEYok6q3B43w8VBVvsHf8HIMzKZ9wC2WkYqqNkCQL-fkJfKQ0LT9F5Xv/exec";

        // Mapbox initialization
        mapboxgl.accessToken = MAPBOX_TOKEN;
        const map = new mapboxgl.Map({
            container: "map",
            style: "mapbox://styles/mapbox/streets-v11",
            center: [121.0437, 14.6760], // default center (Metro Manila); adjust as needed
            zoom: 12
        });

        map.addControl(new mapboxgl.NavigationControl());

        let marker = null;
        const latInput = document.getElementById("lat");
        const lngInput = document.getElementById("lng");
        const coordsDisplay = document.getElementById("coords-display");

        // helper to update hidden inputs and display
        function updateCoords(lngLat) {
            lngInput.value = lngLat.lng || lngLat[0];
            latInput.value = lngLat.lat || lngLat[1];
            coordsDisplay.textContent = "Lat: " + parseFloat(latInput.value).toFixed(6) + " • Lng: " + parseFloat(lngInput.value).toFixed(6);
        }

        // Place marker at given lngLat (object {lng, lat} or array)
        function placeMarker(lngLat) {
            if (marker) {
                marker.setLngLat(lngLat);
            } else {
                marker = new mapboxgl.Marker({ draggable: true })
                    .setLngLat(lngLat)
                    .addTo(map);
                marker.on("dragend", function() {
                    const ll = marker.getLngLat();
                    updateCoords(ll);
                });
            }
            updateCoords(lngLat);
            map.flyTo({ center: lngLat, zoom: 15 });
        }

        // Map click to set marker
        map.on("click", (e) => {
            placeMarker(e.lngLat);
        });

        // Use device geolocation
        document.getElementById("use-location-btn").addEventListener("click", () => {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }
            navigator.geolocation.getCurrentPosition((pos) => {
                const lngLat = [pos.coords.longitude, pos.coords.latitude];
                placeMarker({ lng: pos.coords.longitude, lat: pos.coords.latitude });
            }, (err) => {
                alert("Unable to retrieve your location. Please allow location access or pick a point on the map.");
            }, { enableHighAccuracy: true });
        });

        document.getElementById("clear-marker-btn").addEventListener("click", () => {
            if (marker) {
                marker.remove();
                marker = null;
            }
            latInput.value = "";
            lngInput.value = "";
            coordsDisplay.textContent = "No location selected";
        });

        // Image preview
        function showPreview() {
            const file = document.getElementById("file").files[0];
            const preview = document.getElementById("preview-img");
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
                document.getElementById("upload-status").innerText = "✅ Photo Attached";
            }
        }

        // Submit function with coords included
        async function submitReport() {
            const fileInput = document.getElementById("file");
            const loc = document.getElementById("loc").value;
            const btn = document.getElementById("submitBtn");

            // Validate photo and coordinates
            if (!fileInput.files[0]) {
                alert("Please take a photo.");
                return;
            }
            if (!latInput.value || !lngInput.value) {
                alert("Please pin the incident location on the map or use your device location.");
                return;
            }
            if (!loc) {
                // optional: allow empty textual location, but original required it — keep requiring it
                alert("Please enter a textual location (street or landmark).");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Sending Report...";

            try {
                // 1. Upload to ImgBB
                const imgForm = new FormData();
                imgForm.append("image", fileInput.files[0]);
                const imgRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: imgForm });
                const imgJson = await imgRes.json();
                const imageUrl = imgJson.data.url;

                // 2. Send to Google Sheets (no-cors)
                const reportData = {
                    type: document.getElementById("type").value,
                    location: loc,
                    description: document.getElementById("desc").value,
                    imageUrl: imageUrl,
                    latitude: latInput.value,
                    longitude: lngInput.value,
                    timestamp: new Date().toISOString()
                };

                await fetch(SHEETS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    body: JSON.stringify(reportData)
                });

                alert("Success! The Barangay has received your report.");
                location.reload();
            } catch (err) {
                console.error(err);
                alert("Error sending report. Please try again.");
                btn.disabled = false;
                btn.innerText = "Post to Barangay Feed";
            }
        }
    </script>
</body>
</html>
