<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tipas Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; padding: 40px; }
        .container { max-width: 900px; margin: auto; }
        .report-card { background: white; display: flex; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; }
        .report-card img { width: 250px; height: 200px; object-fit: cover; }
        .report-content { padding: 20px; flex: 1; }
        .badge { background: #ff4757; color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        h1 { color: #2f3542; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚨 Barangay Tipas: Live Incident Feed</h1>
        <div id="admin-feed">Waiting for reports...</div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDeKvRKTnlAfRGMQWbf2OQ3hkPmhQ5Z5cQ",
        authDomain: "actfast-tipas.firebaseapp.com",
        projectId: "actfast-tipas",
        storageBucket: "actfast-tipas.firebasestorage.app",
        messagingSenderId: "848943253174",
        appId: "1:848943253174:web:444d5c8f63534803dec817"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const reportsRef = ref(db, 'reports');

    onValue(reportsRef, (snapshot) => {
        const data = snapshot.val();
        const feed = document.getElementById("admin-feed");
        feed.innerHTML = "";

        if (!data) {
            feed.innerHTML = "<h3>No active reports.</h3>";
            return;
        }

        Object.values(data).reverse().forEach(report => {
            feed.innerHTML += `
                <div class="report-card">
                    <img src="${report.imageUrl}" onclick="window.open('${report.imageUrl}')">
                    <div class="report-content">
                        <span class="badge">${report.type.toUpperCase()}</span>
                        <h2 style="margin: 10px 0;">📍 ${report.location}</h2>
                        <p>${report.description}</p>
                        <small style="color: #a4b0be;">${report.timestamp}</small>
                    </div>
                </div>
            `;
        });
    });
</script>
</body>
</html>
