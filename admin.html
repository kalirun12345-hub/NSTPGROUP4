<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tipas Admin Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; margin-bottom: 20px; }
        #status { color: #2ecc71; font-weight: bold; font-size: 0.9rem; }
        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 20px; display: flex; gap: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card img { width: 220px; height: 160px; object-fit: cover; border-radius: 10px; cursor: pointer; }
        .info { flex: 1; }
        .badge { background: #e74c3c; color: white; padding: 4px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        h2 { margin: 10px 0; }
        .no-data { text-align: center; color: #888; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚨 Tipas Live Feed</h1>
            <div id="status">Syncing...</div>
        </header>
        <div id="feed">Checking for new reports...</div>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSk8FzJA22kp4__EJhyYXlAzZ7lMPeLBFRBQ3QaHmml3usecNfpyrEwVLXSMBnOFSJt_WRbJAakgYtU/pub?output=csv";

        async function updateDashboard() {
            try {
                // Adding a timestamp to the URL prevents the browser from showing old data
                const response = await fetch(CSV_URL + "&t=" + new Date().getTime());
                const csvData = await response.text();
                
                // Parse CSV rows
                const rows = csvData.split(/\r?\n/).map(row => {
                    const matches = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    return matches ? matches.map(m => m.replace(/^"|"$/g, '')) : [];
                });

                const feed = document.getElementById("feed");
                const reports = rows.slice(1).reverse(); // Newest first

                if (reports.length === 0 || reports[0].length < 2) {
                    feed.innerHTML = "<div class='no-data'>No reports currently active.</div>";
                } else {
                    let cardsHtml = "";
                    reports.forEach(cols => {
                        if(cols.length < 5) return;
                        cardsHtml += `
                            <div class="card">
                                <img src="${cols[4]}" onclick="window.open('${cols[4]}')">
                                <div class="info">
                                    <span class="badge">${cols[1]}</span>
                                    <h2>📍 ${cols[2]}</h2>
                                    <p>${cols[3] || 'No extra details provided.'}</p>
                                    <small style="color:#7f8c8d">Reported: ${cols[0]}</small>
                                </div>
                            </div>`;
                    });
                    feed.innerHTML = cardsHtml;
                }
                document.getElementById("status").innerText = "● LIVE - Last Sync: " + new Date().toLocaleTimeString();
            } catch (err) {
                console.error("Sync error:", err);
            }
        }

        // Run every 5 seconds for a "live" feel
        updateDashboard();
        setInterval(updateDashboard, 5000);
    </script>
</body>
</html>
