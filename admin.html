<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tipas Admin Dashboard</title>

    <!-- Mapbox -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>

    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; margin-bottom: 20px; }
        #status { color: #2ecc71; font-weight: bold; font-size: 0.9rem; }

        .card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 240px 1fr 260px;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
        }

        .info { flex: 1; }

        .mapbox {
            width: 100%;
            height: 160px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .badge {
            background: #e74c3c;
            color: white;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 6px;
        }

        h2 { margin: 5px 0; font-size: 1.1rem; }

        .no-data { text-align: center; color: #888; margin-top: 50px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🚨 Live Stream! 🚨</h1>
        <div id="status">Syncing...</div>
    </header>

    <div id="feed">Checking for new reports...</div>
</div>

<script>
/* ================= CONFIG ================= */
const MAPBOX_TOKEN = "pk.eyJ1IjoiYW51Ymlzczc3OCIsImEiOiJjbWtyb2Vkd3AxM3NzM2hzYTQwamIxNHliIn0.mo5XWD4HZWVEpGKf0Gf-nQ";
const API_URL = "https://script.google.com/macros/s/AKfycbwmiHQ-NCbueWX5EEpivvaAOd0B7K8KunO-8Zs_eAmMsGSweTCDAF3Uc-2dLqChAl4O/exec";

mapboxgl.accessToken = MAPBOX_TOKEN;

/* ================= UPDATE DASHBOARD ================= */
async function updateDashboard() {
  try {
    const response = await fetch(API_URL + "?t=" + Date.now());
    const reports = await response.json();

    const feed = document.getElementById("feed");

    if (!reports || reports.length === 0) {
      feed.innerHTML = "<div class='no-data'>No reports currently active.</div>";
      document.getElementById("status").innerText = "● LIVE - " + new Date().toLocaleTimeString();
      return;
    }

    let cardsHtml = "";

    const reversed = [...reports].reverse();

    reversed.forEach((r, index) => {
      const mapId = "map-" + index;

      cardsHtml += `
        <div class="card">
          <div>
            ${r.imageUrl ? `<img src="${r.imageUrl}" onclick="window.open('${r.imageUrl}', '_blank')">` : "<div>No Image</div>"}
          </div>

          <div class="info">
            <span class="badge">${r.type}</span>
            <h2>📍 ${r.location}</h2>
            <p>${r.details || ""}</p>
            <small style="color:#7f8c8d">Reported: ${r.timestamp}</small>
            <br>
            <small>Lat: ${r.lat || "?"} | Lng: ${r.lng || "?"}</small>
          </div>

          <div>
            <div class="mapbox" id="${mapId}"></div>
          </div>
        </div>
      `;
    });

    feed.innerHTML = cardsHtml;

    // Init maps AFTER DOM update
    reversed.forEach((r, index) => {
      const lat = parseFloat(r.lat);
      const lng = parseFloat(r.lng);
      const mapId = "map-" + index;

      if (!isNaN(lat) && !isNaN(lng)) {
        const map = new mapboxgl.Map({
          container: mapId,
          style: "mapbox://styles/mapbox/light-v11",
          center: [lng, lat],
          zoom: 15,
          interactive: false
        });

        new mapboxgl.Marker({ color: "red" })
          .setLngLat([lng, lat])
          .addTo(map);

        map.on("load", () => map.resize());
      }
    });

    document.getElementById("status").innerText = "● LIVE - " + new Date().toLocaleTimeString();

  } catch (err) {
    console.error("Sync error:", err);
    document.getElementById("status").innerText = "● OFFLINE - " + new Date().toLocaleTimeString();
  }
}

updateDashboard();
setInterval(updateDashboard, 10000);
</script>
</body>
</html>
