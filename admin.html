<!DOCTYPE html>
<html>
<head>
  <title>Tipas Admin Dashboard</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>

  <style>
    body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
    .container { max-width: 1100px; margin: auto; }
    header { display:flex; justify-content:space-between; border-bottom:2px solid #ccc; margin-bottom:20px; }

    .card {
      background:white; border-radius:15px; padding:15px; margin-bottom:20px;
      display:grid; grid-template-columns:240px 1fr 260px; gap:15px;
      box-shadow:0 4px 10px rgba(0,0,0,0.05);
    }

    img { width:100%; height:160px; object-fit:cover; border-radius:10px; }

    .mapbox { width:100%; height:160px; border-radius:10px; border:1px solid #ddd; }

    .badge { padding:4px 10px; border-radius:6px; color:white; font-weight:bold; font-size:12px; }
    .pending { background:#f1c40f; }
    .progress { background:#3498db; }
    .resolved { background:#2ecc71; }

    .actions button {
      margin-right:6px;
      padding:6px 10px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-weight:bold;
    }

    .btn-progress { background:#3498db; color:white; }
    .btn-resolve { background:#2ecc71; color:white; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>🚨 Tipas Admin</h1>
    <div id="status">LIVE</div>
  </header>

  <div id="feed">Loading...</div>
</div>

<script>
const MAPBOX_TOKEN = "YOUR_MAPBOX_TOKEN";
const API_URL = "YOUR_WEBAPP_URL";

mapboxgl.accessToken = MAPBOX_TOKEN;

async function updateStatus(rowIndex, status) {
  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "updateStatus",
      rowIndex: rowIndex,
      status: status
    })
  });

  updateDashboard();
}

async function updateDashboard() {
  const res = await fetch(API_URL + "?t=" + Date.now());
  const reports = await res.json();

  const feed = document.getElementById("feed");
  let html = "";

  const reversed = [...reports].reverse();

  reversed.forEach((r, i) => {
    const mapId = "map-" + i;

    let badgeClass = "pending";
    if (r.status === "In Progress") badgeClass = "progress";
    if (r.status === "Resolved") badgeClass = "resolved";

    html += `
      <div class="card">
        <div>
          ${r.imageUrl ? `<img src="${r.imageUrl}">` : ""}
        </div>

        <div>
          <span class="badge ${badgeClass}">${r.status}</span>
          <h3>📍 ${r.location}</h3>
          <p><b>${r.type}</b></p>
          <p>${r.details || ""}</p>
          <small>${r.timestamp}</small>

          <div class="actions" style="margin-top:10px;">
            <button class="btn-progress" onclick="updateStatus(${r.rowIndex}, 'In Progress')">In Progress</button>
            <button class="btn-resolve" onclick="updateStatus(${r.rowIndex}, 'Resolved')">Resolved</button>
          </div>
        </div>

        <div>
          <div class="mapbox" id="${mapId}"></div>
        </div>
      </div>
    `;
  });

  feed.innerHTML = html;

  reversed.forEach((r, i) => {
    if (r.lat && r.lng) {
      const map = new mapboxgl.Map({
        container: "map-" + i,
        style: "mapbox://styles/mapbox/light-v11",
        center: [r.lng, r.lat],
        zoom: 15,
        interactive: false
      });

      new mapboxgl.Marker().setLngLat([r.lng, r.lat]).addTo(map);
    }
  });
}

updateDashboard();
setInterval(updateDashboard, 10000);
</script>
</body>
</html>
